          const acct = finAccounts.find(a=>a.id===imp.accountId);
          const c    = acct ? companies.find(x=>x.id===acct.entityId) : null;
          const prog = imp.itemCount ? Math.round((imp.reviewedCount||0)/imp.itemCount*100) : 0;
          return `<div class="bill" style="display:flex;align-items:center;gap:8px">
            <div style="flex:1;cursor:pointer" data-stmtopen="${imp.id}">
              <div class="bbody">
                <div class="bname">${esc(imp.fileName||'Ekstre')}</div>
                <div class="bmeta">
                  <span class="bday">${finFmtDate(imp.statementStartDate||'')} – ${finFmtDate(imp.statementEndDate||'')}</span>
                  ${acct?`<span class="btag genel">${esc((c?c.name+' / ':'')+acct.name)}</span>`:''}
                </div>
              </div>
              <div style="text-align:right;font-size:12px;color:var(--muted)">${imp.itemCount} hareket · ${prog}% incelendi</div>
            </div>
            <button class="btn-ghost" data-stmtdelete="${imp.id}" style="font-size:11px;padding:4px 10px;color:#c0392b;flex-shrink:0">Sil</button>
          </div>`;
        }).join('')}
      </div>` : ''}`;
}

function _finReconcileReviewHTML(importId){
  const imp = finStmtImports.find(x=>x.id===importId);
  if(!imp) return `<div class="empty">Import bulunamadı.</div>`;

  const acct = finAccounts.find(a=>a.id===imp.accountId);
  const c    = acct ? companies.find(x=>x.id===acct.entityId) : null;
  const acctName = acct ? (c?c.name+' / ':'')+acct.name : '?';
  const minAmt = view.stmtMinAmount || 50;
  const showAll = view.stmtShowAll || false;

  const total    = finStmtItems.length;
  const above    = finStmtItems.filter(i=>i.amount >= minAmt).length;
  const nReview  = finStmtItems.filter(i=>i.status==='REVIEW').length;
  const nMatched = finStmtItems.filter(i=>i.status==='MATCHED').length;
  const nApproved= finStmtItems.filter(i=>i.status==='APPROVED').length;
  const nIgnored = finStmtItems.filter(i=>i.status==='IGNORED').length;

  let items = showAll ? finStmtItems : finStmtItems.filter(i=>i.amount >= minAmt);
  items = [...items].sort((a,b)=>(a.date||'').localeCompare(b.date||''));

  const statsHTML = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;text-align:center;font-size:12px;">
      <div class="card" style="padding:10px 6px"><div style="font-size:18px;font-weight:700">${total}</div><div style="color:var(--muted)">Toplam</div></div>
      <div class="card" style="padding:10px 6px"><div style="font-size:18px;font-weight:700;color:#c0392b">${nReview}</div><div style="color:var(--muted)">İncelenecek</div></div>
      <div class="card" style="padding:10px 6px"><div style="font-size:18px;font-weight:700;color:var(--good)">${nApproved}</div><div style="color:var(--muted)">Onaylanan</div></div>
      <div class="card" style="padding:10px 6px"><div style="font-size:18px;font-weight:700;color:#7C3AED">${nMatched}</div><div style="color:var(--muted)">Eşleşen</div></div>
      <div class="card" style="padding:10px 6px"><div style="font-size:18px;font-weight:700">${above}</div><div style="color:var(--muted)">${minAmt}₺ üzeri</div></div>
      <div class="card" style="padding:10px 6px"><div style="font-size:18px;font-weight:700;color:var(--faint)">${nIgnored}</div><div style="color:var(--muted)">Yok Sayılan</div></div>
    </div>`;

  const filterHTML = `
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:13px;">
      <button class="btn-ghost" id="stmtBack" style="padding:6px 12px;font-size:12px;">← Geri</button>
      <span style="color:var(--muted);font-size:12px">${esc(acctName)} · ${esc(imp.fileName||'Ekstre')}</span>
      <div style="margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12px;">
        Min:<input type="number" id="stmtMinAmtFilter" value="${minAmt}" min="0" step="10"
          style="width:64px;font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);margin-left:4px">
        <button class="btn-ghost" id="stmtToggleAll" style="font-size:12px;padding:4px 10px">${showAll?'Filtrele':'Tümünü Göster'}</button>
      </div>
    </div>`;

  const pendingItems = items.filter(i=>i.status==='REVIEW'||i.status==='MATCHED');
  const bulkHTML = pendingItems.length > 0 ? `
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:10px;font-size:12px;">
      <input type="checkbox" id="stmtSelectAll" style="width:16px;height:16px">
      <label for="stmtSelectAll" style="cursor:pointer">Tümünü seç</label>
      <button class="btn-ghost" id="stmtBulkIgnore" style="font-size:12px;padding:4px 10px;color:#c0392b">Seçilenleri Yok Say</button>
    </div>` : '';

  const rowsHTML = items.length === 0
    ? `<div class="empty" style="padding:30px 0"><div style="font-weight:500">Görüntülenecek hareket yok</div></div>`
    : items.map(item => {
        const dirIcon = item.direction==='OUT' ? '−' : '+';
        const dirCls  = item.direction==='OUT' ? 'color:#A4453B' : 'color:var(--good)';
        const matchTx = item.matchedTransactionId ? finTransactions.find(t=>t.id===item.matchedTransactionId) : null;

        let badge = '';
        if(item.status==='MATCHED')  badge = `<span class="btag" style="background:#EDE9FE;color:#7C3AED">Eşleşti</span>`;
        if(item.status==='APPROVED') badge = `<span class="btag" style="background:#D1FAE5;color:#065F46">Onaylandı</span>`;
        if(item.status==='IGNORED')  badge = `<span class="btag" style="background:var(--paper-2);color:var(--muted)">Yok Sayıldı</span>`;

        let actions = '';
        if(item.status==='REVIEW'){
          actions = `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:8px">
            <button class="btn-prim" data-classify="${item.id}" data-ctype="EXPENSE" style="font-size:11px;padding:4px 10px">Gider</button>
            <button class="btn-prim" data-classify="${item.id}" data-ctype="INCOME"  style="font-size:11px;padding:4px 10px;background:#2F6E57">Gelir</button>
            <button class="btn-prim" data-classify="${item.id}" data-ctype="TRANSFER" style="font-size:11px;padding:4px 10px;background:#7C3AED">Transfer</button>
            <button class="btn-ghost" data-ignorestmt="${item.id}" style="font-size:11px;padding:4px 10px">Yok Say</button>
          </div>`;
        } else if(item.status==='MATCHED'){
          const mName = matchTx?(matchTx.merchant||matchTx.description||matchTx.transactionType):'?';
          actions = `
            <div style="margin-top:5px;font-size:11px;color:#7C3AED">Mevcut: ${esc(mName)} · ${finFmtDate(matchTx?matchTx.date:'')}</div>
            <div style="display:flex;gap:4px;margin-top:5px;flex-wrap:wrap">
              <button class="btn-ghost" data-confirmmatch="${item.id}" style="font-size:11px;padding:4px 10px;color:#7C3AED">Eşleştir (Yeni Kayıt Açma)</button>
              <button class="btn-ghost" data-unmatch="${item.id}" style="font-size:11px;padding:4px 10px">Eşleşmeyi Kaldır</button>
              <button class="btn-ghost" data-ignorestmt="${item.id}" style="font-size:11px;padding:4px 10px">Yok Say</button>
            </div>`;
        } else {
          actions = `<div style="margin-top:5px"><button class="btn-ghost" data-reopenstmt="${item.id}" style="font-size:11px;padding:4px 10px">Geri Al</button></div>`;
        }

        const checkable = item.status==='REVIEW'||item.status==='MATCHED';
        return `<div class="card" style="margin-bottom:8px;padding:12px 14px;${item.status==='IGNORED'?'opacity:.5':''}">
          <div style="display:flex;gap:8px;align-items:flex-start">
            ${checkable?`<input type="checkbox" class="stmt-row-cb" data-itemid="${item.id}" style="width:16px;height:16px;margin-top:3px;flex-shrink:0">`:'<div style="width:16px;flex-shrink:0"></div>'}
            <div style="flex:1;min-width:0">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
                <div style="min-width:0">
                  <div style="font-weight:500;font-size:13px;word-break:break-word">${esc(item.description)}</div>
                  <div style="font-size:11px;color:var(--muted);margin-top:2px">${finFmtDate(item.date)} ${badge}</div>
                </div>
                <div style="${dirCls};font-weight:700;font-size:15px;white-space:nowrap;flex-shrink:0">${dirIcon}${finFmtCurrency(item.amount,'TRY')}</div>
              </div>
              ${actions}
            </div>
          </div>
        </div>`;
      }).join('');

  return `${filterHTML}${statsHTML}${bulkHTML}<div id="stmtReviewList">${rowsHTML}</div>`;
}

/* ---------- Classify modal ---------- */
function _finOpenClassifyModal(itemId, ctype){
  if(!currentUser) return;
  const uid = currentUser.uid;
  const item = finStmtItems.find(x=>x.id===itemId);
  if(!item) return;

  const acctOpts = finAccounts.map(a => {
    const co = companies.find(x=>x.id===a.entityId);
    return `<option value="${a.id}" ${a.id===item.accountId?'selected':''}>${esc((co?co.name+' / ':'')+a.name)}</option>`;
  }).join('');
  const entityOpts = companies.map(co =>
    `<option value="${co.id}" ${co.id===item.entityId?'selected':''}>${esc(co.name)}</option>`
  ).join('');
  const catOpts = finCategories
    .filter(cat=>!cat.type||cat.type===(ctype==='INCOME'?'INCOME':'EXPENSE')||cat.type==='GENERAL')
    .map(cat=>`<option value="${cat.id}">${esc(cat.name)}</option>`).join('');
  const otherAcctOpts = finAccounts.filter(a=>a.id!==item.accountId).map(a => {
    const co = companies.find(x=>x.id===a.entityId);
    return `<option value="${a.id}">${esc((co?co.name+' / ':'')+a.name)}</option>`;
  }).join('');
  const purposeOpts = Object.entries(FIN_TRANSFER_LABELS).filter(([k])=>k!=='UNCLASSIFIED')
    .map(([k,v])=>`<option value="${k}" ${k==='INTERNAL'?'selected':''}>${v}</option>`).join('');

  const typeLabel = ctype==='EXPENSE'?'Gider':ctype==='INCOME'?'Gelir':'Transfer';
  modal.innerHTML = `
    <div class="modal-head">
      <div class="eyebrow">${esc(typeLabel)} — Ekstre Onayı</div>
      <h3 style="font-size:13px;font-weight:400;color:var(--muted);margin-top:2px">${esc(item.description.substring(0,60))} · ${finFmtCurrency(item.amount,'TRY')}</h3>
    </div>
    <div class="modal-body">
      <div class="field"><label>Tarih</label><input type="date" id="clDate" value="${item.date}"></div>
      <div class="field"><label>Tutar</label><input type="number" id="clAmt" step="0.01" value="${item.amount}"></div>
      ${ctype==='TRANSFER'?`
        ${item.direction==='OUT'?`
          <div class="field"><label>Kaynak Hesap</label><select id="clSrc">${acctOpts}</select></div>
          <div class="field"><label>Hedef Hesap</label><select id="clDst">${otherAcctOpts}</select></div>
        `:`
          <div class="field"><label>Kaynak Hesap</label><select id="clSrc">${otherAcctOpts}</select></div>
          <div class="field"><label>Hedef Hesap</label><select id="clDst">${acctOpts}</select></div>
        `}
        <div class="field"><label>Transfer Amacı</label><select id="clPurpose">${purposeOpts}</select></div>
      `:`
        <div class="field"><label>Hesap</label><select id="clAcct">${acctOpts}</select></div>
        <div class="field"><label>Şirket</label><select id="clEntity"><option value="">— seç —</option>${entityOpts}</select></div>
        <div class="field"><label>Kategori</label><select id="clCat"><option value="">— seç —</option>${catOpts}</select></div>
      `}
      <div class="field"><label>Not / Açıklama</label><input type="text" id="clNote" value="${esc(item.description||'')}" placeholder="Opsiyonel"></div>
      <div class="modal-foot">
        <button class="btn-ghost" id="clCancel">İptal</button>
        <button class="btn-prim" id="clApprove">Onayla</button>
      </div>
    </div>`;
  overlay.classList.add('show');

  $('#clCancel').onclick = closeModal;
  $('#clApprove').onclick = async () => {
    const dateVal = $('#clDate').value;
    const amtVal  = parseFloat(($('#clAmt')||{}).value)||0;
    if(!dateVal||amtVal<=0){ toast('Tarih ve tutar gerekli'); return; }

    let txData;
    if(ctype==='TRANSFER'){
      const srcId = ($('#clSrc')||{}).value;
      const dstId = ($('#clDst')||{}).value;
      if(!srcId||!dstId){ toast('Kaynak ve hedef hesap gerekli'); return; }
      const srcA = finAccounts.find(a=>a.id===srcId);
      const dstA = finAccounts.find(a=>a.id===dstId);
      if((srcA?srcA.currency:'TRY') !== (dstA?dstA.currency:'TRY')){ toast('Farklı para birimi — transfer engellendi'); return; }
      txData = {
        id: generateId(), transactionType:'TRANSFER', date:dateVal, amount:amtVal,
        currency:(srcA?srcA.currency:null)||'TRY',
        sourceAccountId:srcId, destinationAccountId:dstId,
        transferPurpose:($('#clPurpose')||{}).value||'INTERNAL',
        description:($('#clNote').value||'').trim()||null,
        status:'active', createdAt:Date.now(), updatedAtClient:Date.now(),
      };
    } else {
      const acctId = ($('#clAcct')||{}).value;
      if(!acctId){ toast('Hesap gerekli'); return; }
      const acct = finAccounts.find(a=>a.id===acctId);
      txData = {
        id: generateId(), transactionType:ctype, date:dateVal, amount:amtVal,
        currency:(acct?acct.currency:null)||'TRY',
        accountId:acctId,
        entityId:($('#clEntity').value)||null,
        categoryId:($('#clCat').value)||null,
        merchant:($('#clNote').value||'').trim()||item.description||null,
        status:'active', createdAt:Date.now(), updatedAtClient:Date.now(),
      };
    }
    await _finApproveStmtItem(uid, itemId, txData);
    closeModal(); render(); toast('Onaylandı — işlem oluşturuldu');
  };
}

/* ---------- Reconcile bindings ---------- */
function _finBindReconcile(){
  // Upload flow (import screen)
  const uploadBtn = document.getElementById('stmtUploadBtn');
  const fileInput = document.getElementById('stmtFileInput');
  if(uploadBtn && fileInput){
    uploadBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async e => {
      const file = e.target.files[0];
      if(!file) return;
      if(file.type !== 'application/pdf'){ toast('Lütfen PDF dosyası seçin'); return; }
      if(!currentUser){ toast('Giriş yapmanız gerekli'); return; }
      const accountId = ($('#stmtAcctSel')||{}).value;
      if(!accountId){ toast('Önce hesap seçin'); return; }
      view.stmtMinAmount = parseInt(($('#stmtMinAmt')||{}).value)||50;
      const prog = document.getElementById('stmtProgress');
      if(prog){ prog.style.display='block'; prog.textContent='PDF analiz ediliyor…'; }
      if(uploadBtn) uploadBtn.disabled = true;
      try {
        const { numPages, totalItems, rows } = await _parsePDF(file);
        const { items: rawItems, candidateCount, fmt } = _parseBankLines(rows);
        const debugMsg = `Sayfa: ${numPages} · Item: ${totalItems} · Satır: ${rows.length} · Aday: ${candidateCount} · Bulunan: ${rawItems.length} · Format: ${fmt}`;
        console.log('PDF debug:', debugMsg);
        if(prog){ prog.style.display='block'; prog.textContent = debugMsg; }
        if(rawItems.length === 0){
          toast('PDF\'den hareket çıkarılamadı. Dijital/metin PDF olduğundan emin olun. Konsolu kontrol et.');
          return;
        }
        if(prog) prog.textContent = debugMsg + ' — kaydediliyor…';
        await _finCreateStmtImport(currentUser.uid, accountId, file.name, rawItems);
        render();
      } catch(e){
        console.error('PDF parse:', e);
        toast('PDF işleme hatası: ' + (e.message||'bilinmeyen hata'));
        if(prog) prog.style.display='none';
      } finally {
        if(uploadBtn) uploadBtn.disabled = false;
        if(fileInput) fileInput.value = '';
      }
    });
  }

  // Open past import
  document.querySelectorAll('[data-stmtopen]').forEach(el =>
    el.addEventListener('click', async () => {
      view.stmtImportId = el.dataset.stmtopen;
      finStmtItems = [];
      render();
    })
  );

  // Delete import
  document.querySelectorAll('[data-stmtdelete]').forEach(btn =>
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      if(!currentUser) return;
      if(!confirm('Bu import silinsin mi? Onaylanan işlemler silinmez.')) return;
      await _finDeleteStmtImport(currentUser.uid, btn.dataset.stmtdelete);
      render(); toast('Import silindi');
    })
  );

  // Back to import screen
  const stmtBack = document.getElementById('stmtBack');
  if(stmtBack) stmtBack.addEventListener('click', () => {
    view.stmtImportId = null; finStmtItems = []; render();
  });

  // Min amount filter
  const minFilter = document.getElementById('stmtMinAmtFilter');
  if(minFilter) minFilter.addEventListener('change', () => {
    view.stmtMinAmount = parseInt(minFilter.value)||0; render();
  });

  // Toggle show-all
  const toggleAll = document.getElementById('stmtToggleAll');
  if(toggleAll) toggleAll.addEventListener('click', () => {
    view.stmtShowAll = !view.stmtShowAll; render();
  });

  // Select all checkbox
  const selAll = document.getElementById('stmtSelectAll');
  if(selAll) selAll.addEventListener('change', () => {
    document.querySelectorAll('.stmt-row-cb').forEach(cb => cb.checked = selAll.checked);
  });

  // Bulk ignore
  const bulkIgnore = document.getElementById('stmtBulkIgnore');
  if(bulkIgnore) bulkIgnore.addEventListener('click', async () => {
    const ids = [...document.querySelectorAll('.stmt-row-cb:checked')].map(cb => cb.dataset.itemid);
    if(ids.length===0){ toast('Hiç seçili yok'); return; }
    await _finBulkIgnoreItems(ids);
    render(); toast(`${ids.length} hareket yok sayıldı`);
  });

  // Classify buttons
  document.querySelectorAll('[data-classify]').forEach(btn =>
    btn.addEventListener('click', () => _finOpenClassifyModal(btn.dataset.classify, btn.dataset.ctype))
  );

  // Individual ignore
  document.querySelectorAll('[data-ignorestmt]').forEach(btn =>
    btn.addEventListener('click', async () => { await _finIgnoreStmtItem(btn.dataset.ignorestmt); render(); })
  );

  // Confirm match (already matched — mark IGNORED, no new tx)
  document.querySelectorAll('[data-confirmmatch]').forEach(btn =>
    btn.addEventListener('click', async () => {
      const item = finStmtItems.find(x=>x.id===btn.dataset.confirmmatch);
      if(!item) return;
      await _saveStmtItem({...item, status:'IGNORED'});
      render(); toast('Mevcut işlemle eşleştirildi');
    })
  );

  // Unmatch
  document.querySelectorAll('[data-unmatch]').forEach(btn =>
    btn.addEventListener('click', async () => { await _finUnmatchStmtItem(btn.dataset.unmatch); render(); })
  );

  // Reopen
  document.querySelectorAll('[data-reopenstmt]').forEach(btn =>
    btn.addEventListener('click', async () => { await _finReopenStmtItem(btn.dataset.reopenstmt); render(); })
  );
}
