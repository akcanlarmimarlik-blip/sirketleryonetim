  <div class="cv" style="--accent:${accent}">

    <div class="cd-hero" style="--c:${accent}">

        <span class="ct-bank">${esc(cd.bank)}</span>

      </div>
      <div class="ct-num">•••• •••• •••• ${esc(cd.last4||'••••')}</div>

      <div class="ct-row"><span>Borç <b>${fmtMoney(debt,cur)}</b></span><span>Limit ${fmtMoney(limit,cur)} · Kalan ${fmtMoney(avail,cur)}</span></div>`:'<div class="ct-row"><span>Limit girilmedi — düzenle ile ekleyebilirsin</span></div>'}
      <div class="ct-foot">
        <span class="ct-due">Son ödeme ayın ${cd.dueDay||'—'}'i${cd.statementDay?` · kesim ${cd.statementDay}'i`:''}</span>
        <button class="ct-paid ${paid?'on':''}" data-cpay="${cd.id}">${paid?'✓ Bu ay ödendi':'Ödendi işaretle'}</button>
      </div>
    </div>

    <div class="cd-stats">
      <div class="stat"><div class="snum">${active.length}</div><div class="slbl">aktif taksit</div></div>
      <div class="stat"><div class="snum">${fmtMoney(monthlyBurden,cur)}</div><div class="slbl">aylık taksit yükü</div></div>
      <div class="stat"><div class="snum">${fmtMoney(remainTotal,cur)}</div><div class="slbl">kalan taksit borcu</div></div>
    </div>

  const ai=$('[data-addinst]');if(ai)ai.addEventListener('click',()=>openInstallmentModal(cd.id,null));

  document.querySelectorAll('[data-iundo]').forEach(b=>b.addEventListener('click',()=>changeInstallment(b.dataset.iundo,-1)));

function installmentItem(i,cur){
  const months=i.months, paidCount=i.paidCount||0;
  const monthly=Number(i.total||0)/months;
  const pct=Math.round(paidCount/months*100);
  const done=paidCount>=months;
  const remaining=months-paidCount;
  let nextLabel='';
  if(!done && i.startMonth){
    const [yy,mm]=i.startMonth.split('-').map(Number);
    nextLabel=new Date(yy, mm-1+paidCount, 1).toLocaleDateString('tr-TR',{month:'long',year:'numeric'});
  }
  return `<div class="inst ${done?'done':''}">
    <div class="inst-main">
      <div class="inst-top">
        <span class="inst-title">${esc(i.title)}</span>
        <button class="rmenu-btn" data-imenu="${i.id}" aria-label="Seçenekler">${svgDots()}</button>
      </div>
      <div class="inst-meta">
        <span class="imono">${fmtMoney(monthly,cur)} × ${months} ay</span>
        <span class="idot">·</span><span class="imono">Toplam ${fmtMoney(i.total,cur)}</span>
        ${!done&&nextLabel?`<span class="idot">·</span><span class="imono next">Sonraki: ${nextLabel}</span>`:''}
      </div>
      <div class="inst-bar"><i style="width:${pct}%"></i></div>
      <div class="inst-foot">
        <span class="iprog">${done?'✓ Tamamlandı':`${paidCount}/${months} taksit ödendi`}</span>
        ${!done?`<span class="iremain">Kalan ${fmtMoney(monthly*remaining,cur)}</span>`:''}
      </div>
    </div>
    <div class="inst-actions">
      ${paidCount>0?`<button class="istep" data-iundo="${i.id}" aria-label="Geri al">−</button>`:''}
      ${!done?`<button class="istep pay" data-ipay="${i.id}">Taksit öde</button>`:''}
    </div>
  </div>`;
}

async function changeInstallment(id,delta){
  const i=installments.find(x=>x.id===id);if(!i)return;
  i.paidCount=Math.min(i.months,Math.max(0,(i.paidCount||0)+delta));
  await put('installments',i);render();
}

  const i=installments.find(x=>x.id===id);if(!i)return;
  popover.innerHTML=`<button data-edit>${svgGear()} Düzenle</button><div class="sep"></div><button class="del" data-del>🗑 Sil</button>`;
  placePopover(anchor);popover.classList.add('show');
  popover.querySelector('[data-edit]').onclick=()=>{closePopover();openInstallmentModal(i.cardId,i)};
  popover.querySelector('[data-del]').onclick=async()=>{closePopover();await del('installments',i.id);installments=installments.filter(x=>x.id!==i.id);render();toast('Taksit silindi')};
}

function openInstallmentModal(cardId,inst){

  const defMonth=inst?inst.startMonth:monthlyKey(new Date());
  modal.innerHTML=`
    <div class="modal-head">
      <div class="eyebrow">${editing?'Taksiti düzenle':'Yeni taksit'}</div>
      <h3>${editing?'Düzenle':'Taksit ekle'}</h3>
    </div>
    <div class="modal-body">
      <div class="field"><label>Açıklama</label>
        <input type="text" id="iTitle" placeholder="Örn. Buzdolabı, telefon" value="${editing?esc(inst.title):''}"></div>
      <div class="two">
        <div class="field"><label>Toplam tutar</label>
          <input type="number" id="iTotal" inputmode="decimal" placeholder="0" value="${editing?inst.total:''}"></div>
        <div class="field"><label>Para birimi</label>
          <div class="seg" id="iCur">${Object.keys(CURR).map(k=>`<button data-c="${k}" class="${k===cur?'on':''}">${k}</button>`).join('')}</div></div>
      </div>
      <div class="two">
        <div class="field"><label>Taksit sayısı (ay)</label>
          <input type="number" id="iMonths" min="1" max="60" placeholder="12" value="${editing?inst.months:''}"></div>
        <div class="field"><label>Başlangıç ayı</label>
          <input type="month" id="iStart" value="${defMonth}"></div>
      </div>
      <div class="field"><label>Şu ana kadar ödenen taksit</label>
        <input type="number" id="iPaid" min="0" placeholder="0" value="${editing?(inst.paidCount||0):0}"></div>
      <div class="modal-foot">
        ${editing?'<button class="btn danger" id="iDelete">Sil</button>':''}
        <button class="btn subtle" id="iCancel">Vazgeç</button>
        <button class="btn primary" id="iSave">${editing?'Kaydet':'Ekle'}</button>
      </div>
    </div>`;
  overlay.classList.add('show');setTimeout(()=>$('#iTitle').focus(),60);
  modal.querySelectorAll('#iCur button').forEach(b=>b.onclick=()=>{cur=b.dataset.c;modal.querySelectorAll('#iCur button').forEach(x=>x.classList.toggle('on',x===b))});
  $('#iCancel').onclick=closeModal;
  $('#iSave').onclick=async()=>{
    const title=$('#iTitle').value.trim();if(!title){$('#iTitle').focus();return}
    const total=parseFloat($('#iTotal').value)||0;
    const months=Math.max(1,parseInt($('#iMonths').value)||1);
    const startMonth=$('#iStart').value||monthlyKey(new Date());
    const paidCount=Math.max(0,Math.min(months,parseInt($('#iPaid').value)||0));
    if(editing){Object.assign(inst,{title,total,currency:cur,months,startMonth,paidCount});await put('installments',inst)}
    else{await put('installments',{id:generateId(),cardId,title,total,currency:cur,months,startMonth,paidCount,createdAt:Date.now()})}
    installments=(await getAll('installments')).sort((a,b)=>(a.createdAt??0)-(b.createdAt??0));
    closeModal();render();toast(editing?'Güncellendi':'Taksit eklendi');
  };
  if(editing)$('#iDelete').onclick=async()=>{await del('installments',inst.id);installments=installments.filter(x=>x.id!==inst.id);closeModal();render();toast('Taksit silindi')};
}

function chequeRow(c){
  const done=!!c.done;
  const cur=c.currency||'TRY';
  const isVerilen=c.type==='verilen';
  let status='',scls='';
  if(done){status='Kapandı';scls='paid'}
  else if(c.dueDate){
    const today=new Date();today.setHours(0,0,0,0);
    const d=new Date(c.dueDate+'T00:00:00');
    const diff=Math.round((d-today)/86400000);
    if(diff<0){status=`${-diff} gün gecikti`;scls='overdue'}
    else if(diff===0){status='Bugün';scls='soon'}
    else{status=`${diff} gün kaldı`;scls=diff<=5?'soon':''}
  }
  const dateLabel=c.dueDate?new Date(c.dueDate+'T00:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'}):'';
  return `<div class="bill cheque ${done?'paid':''}">
    <button class="bcheck" data-qpay="${c.id}" aria-label="Kapat">${svgCheck()}</button>
    <div class="bbody" data-qedit="${c.id}">
      <div class="bname">${esc(c.title)} <span class="qtag ${isVerilen?'verilen':'alinan'}">${isVerilen?'Ödenecek':'Tahsil'}</span></div>
      <div class="bmeta">
        ${dateLabel?`<span class="bday">${dateLabel}</span>`:''}
        ${c.bank?`<span class="btag genel">${esc(c.bank)}</span>`:''}
        ${status?`<span class="bstat ${scls}">${status}</span>`:''}
      </div>
    </div>
    <div class="bamt ${isVerilen?'neg':'pos'}">${isVerilen?'−':'+'}${fmtMoney(c.amount,cur)}</div>
    <button class="rmenu-btn" data-qmenu="${c.id}" aria-label="Seçenekler">${svgDots()}</button>
  </div>`;
}

function renderChequesPage(){
  document.documentElement.style.setProperty('--accent','#A45D4E');
  const sorted=[...cheques].sort((a,b)=>String(a.dueDate||'zzz').localeCompare(String(b.dueDate||'zzz')));
  const pending=cheques.filter(c=>!c.done);
  const sums={};
  pending.forEach(c=>{const s=sums[c.currency||'TRY']=sums[c.currency||'TRY']||{verilen:0,alinan:0};s[c.type==='verilen'?'verilen':'alinan']+=Number(c.amount||0)});
  const chips=Object.entries(sums).map(([cur,s])=>`
    ${s.verilen?`<span class="sumchip"><em>ödenecek</em> <b>${fmtMoney(s.verilen,cur)}</b></span>`:''}
    ${s.alinan?`<span class="sumchip paid"><em>tahsil</em> ${fmtMoney(s.alinan,cur)}</span>`:''}`).join('');
  const rows= sorted.length? sorted.map(chequeRow).join('') :
    `<div class="empty"><div class="ico">◌</div><div style="font-weight:500;color:var(--ink)">Henüz çek yok</div><div style="font-size:13px;margin-top:4px">Verdiğin ve aldığın çekleri vade tarihiyle ekle; gününü ve tutarını gör.</div></div>`;
  app.innerHTML=`
  <div class="cv" style="--accent:#A45D4E;--accent-tint:#F1E2DD">
    <button class="backbtn" data-back>${svgBack()} Genel bakış</button>
    <div class="cv-head">
      <span class="logo" style="background:var(--accent-tint);color:var(--accent);width:56px;height:56px">${svgCheque()}</span>
      <div class="cv-title">
        <div class="eyebrow" style="color:var(--accent)">Vade takibi</div>
        <h2>Çeklerim</h2>
      </div>
      <span class="spacer"></span>
      <button class="sec-add" data-addcheque>${svgPlus()} Çek ekle</button>
    </div>
    ${chips?`<div class="billtotals" style="border-top:none;padding-top:0;margin-top:0;margin-bottom:18px">${chips}</div>`:''}
    <div class="billlist">${rows}</div>
  </div>
  ${renderFooter()}
  `;
  $('[data-back]').addEventListener('click',()=>{view={page:'home',companyId:null,section:null,cardId:null,homeTab:view.homeTab||'overview'};render()});
  const aq=$('[data-addcheque]');if(aq)aq.addEventListener('click',()=>openChequeModal(null));
  document.querySelectorAll('[data-qpay]').forEach(b=>b.addEventListener('click',async e=>{e.stopPropagation();await toggleCheque(b.dataset.qpay);render()}));
  document.querySelectorAll('[data-qedit]').forEach(b=>b.addEventListener('click',()=>{const c=cheques.find(x=>x.id===b.dataset.qedit);if(c)openChequeModal(c)}));
  document.querySelectorAll('[data-qmenu]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openChequeMenu(b.dataset.qmenu,b)}));
  bindFooter();
}

async function toggleCheque(id){const c=cheques.find(x=>x.id===id);if(!c)return;c.done=!c.done;await put('cheques',c)}

        for(const it of (data.installments||[]))await put('installments',it);
        for(const ch of (data.cheques||[]))await put('cheques',ch);
        for(const bk of (data.banks||[]))await put('banks',bk);

function parseFirebaseConfig(raw){
  if(!raw)return null;
  try{return JSON.parse(raw)}catch(e){}
  const m=raw.match(/\{[\s\S]*\}/);
  if(m){
    try{return JSON.parse(m[0])}catch(e){}
    try{return (new Function('return ('+m[0]+')'))()}catch(e){}
  }
  return null;
}

let _fbBootstrapped = false;
async function bootstrapFirebase(){
  if(_fbBootstrapped) return;
  const cfg = parseFirebaseConfig(cloudCfg.config || EMBEDDED_FIREBASE_CONFIG);
  if(!cfg || !cfg.projectId) return;
  const appMod  = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const authMod = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
  const fsMod   = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  const apps = appMod.getApps();
  const appI = apps.length ? appMod.getApp() : appMod.initializeApp(cfg);
  const authI = authMod.getAuth(appI);
  await authMod.setPersistence(authI, authMod.browserLocalPersistence);
  let fsDb;
  try {
    if(fsMod.initializeFirestore && fsMod.persistentLocalCache){
      fsDb = fsMod.initializeFirestore(appI, {localCache: fsMod.persistentLocalCache()});
    } else {
      fsDb = fsMod.getFirestore(appI);
    }
  } catch(e){
    try { fsDb = fsMod.getFirestore(appI); } catch(e2){}
  }
  fb = {fs: fsMod, db: fsDb, authMod, authI};
  _fbBootstrapped = true;
}

function cloudReminderItems(){
  const out=[];
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const pad=n=>String(n).padStart(2,'0');
  const dim=new Date(y,m+1,0).getDate();
  cheques.forEach(c=>{
    if(!c.dueDate)return;
    out.push({key:'cheque_'+c.id,title:c.title||'Çek',sub:(c.type==='verilen'?'Çek · ödenecek':'Çek · tahsil'),dueDate:c.dueDate,amount:Number(c.amount||0)||null,currency:c.currency||'TRY',done:!!c.done});
  });
  bills.forEach(b=>{
    if(!b.dueDay)return;
    const dd=`${y}-${pad(m+1)}-${pad(Math.min(b.dueDay,dim))}`;
    out.push({key:'bill_'+b.id,title:b.name,sub:'Fatura',dueDate:dd,amount:null,currency:null,done:isPaid(b.id)});
  });
  cards.forEach(cd=>{
    if(!cd.dueDay)return;
    const dd=`${y}-${pad(m+1)}-${pad(Math.min(cd.dueDay,dim))}`;
    out.push({key:'card_'+cd.id,title:(cd.bank||'Kart')+' ekstresi',sub:'Kredi kartı',dueDate:dd,amount:Number(cd.debt||0)||null,currency:cd.currency||'TRY',done:isPaid(cd.id)});
  });
  return out;
}

async function syncCloud(silent){
  if(!cloudReady){if(!silent)toast('Önce bulut ayarlarını gir');return}
  try{
    const {collection,doc,setDoc,deleteDoc,getDocs}=fb.fs;
    const items=cloudReminderItems();
    const keys=new Set(items.map(i=>i.key));
    for(const it of items){
      await setDoc(doc(fb.db,'reminders',it.key),
        {title:it.title,sub:it.sub,dueDate:it.dueDate,amount:it.amount,currency:it.currency,done:it.done,updatedAt:Date.now()},
        {merge:true});
    }
    const snap=await getDocs(collection(fb.db,'reminders'));
    for(const d of snap.docs){ if(!keys.has(d.id)) await deleteDoc(d.ref); }
    if(!silent)toast('Bulut senkronlandı');
  }catch(e){ if(!silent)toast('Senkron hatası'); console.error(e); }
}

function startCloudLoop(){
  clearInterval(cloudTimer);
  cloudTimer=setInterval(()=>{ if(cloudReady){ cloudPushAll(); syncCloud(true); } }, 5*60*1000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&cloudReady) cloudPushAll(); },{once:false});
}

/* ---------- TAM VERİ SENKRONU (cihazlar arası ortak kullanım) ---------- */
let deviceId='';
let pushTimer=null, remotePullTimer=null, listenersOn=false;

function clean(items){ try{ return JSON.parse(JSON.stringify(items)); }catch(e){ return items; } }

function schedulePush(){
  if(!cloudReady)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{ cloudPushAll(); syncCloud(true); }, 1500);
}

async function cloudPushAll(){
  if(!cloudReady)return;
  try{
    const {doc,setDoc}=fb.fs;
    for(const s of SYNC_STORES){
      const items=clean(await getAll(s));
      await setDoc(doc(fb.db,'appdata',s),{items,updatedAt:Date.now(),deviceId},{merge:false});
    }
  }catch(e){console.error('push',e)}
}

async function cloudPullAll(){
  if(!cloudReady)return;
  suppressPush=true;
  try{
    const {doc,getDoc}=fb.fs;
    for(const s of SYNC_STORES){
      const snap=await getDoc(doc(fb.db,'appdata',s));
      if(snap.exists()){
        const items=snap.data().items||[];
        await clearStore(s);
        for(const it of items) await put(s,it);
      }
    }
    await loadAll();
    await seedPersonalCompany();
    await loadAll();
    render();
  }catch(e){console.error('pull',e)}
  finally{ suppressPush=false; }
}

function scheduleRemotePull(){
  clearTimeout(remotePullTimer);
  remotePullTimer=setTimeout(cloudPullAll,900);
}

function attachCloudListeners(){
  if(listenersOn||!cloudReady)return;
  const {doc,onSnapshot}=fb.fs;
  for(const s of SYNC_STORES){
    onSnapshot(doc(fb.db,'appdata',s),snap=>{
      if(!snap.exists())return;
      const d=snap.data();
      if(d.deviceId===deviceId)return; // kendi yazdığımız değişiklik, atla
      scheduleRemotePull();
    });
  }
  listenersOn=true;
}

async function cloudConnect_postAuth(){
  if(!fb || !fb.db) throw new Error('Firebase başlatılmadı');
  if(!deviceId){
    const dv=await getOne('settings','device');
    deviceId=(dv&&dv.data&&dv.data.id)||(Date.now().toString(36)+Math.random().toString(36).slice(2,8));
    await put('settings',{id:'device',data:{id:deviceId}});
  }
  const {doc,getDoc}=fb.fs;
  const compSnap=await getDoc(doc(fb.db,'appdata','companies'));
  const cloudHasData = compSnap.exists() && (compSnap.data().items||[]).length>0;
  if(cloudHasData){ await cloudPullAll(); }
  else { await cloudPushAll(); }
  attachCloudListeners();
  syncCloud(true);
}

  const c=cfg||waCfg;
  return new Promise(res=>{
    try{
      const phone=(c.phone||'').replace(/[^0-9]/g,'');
      if(!phone||!c.apikey)return res(false);
      const url=`https://api.callmebot.com/whatsapp.php?phone=${encodeURIComponent(phone)}&text=${encodeURIComponent(text)}&apikey=${encodeURIComponent(c.apikey)}`;
      fetch(url,{mode:'no-cors'}).then(()=>res(true)).catch(()=>{
        const img=new Image();img.onload=()=>res(true);img.onerror=()=>res(true);img.src=url;
      });
    }catch(e){res(false)}
  });
}

function reminderText(it){
  let when;
  if(it.days<0)when=`${-it.days} gün GECİKTİ`;
  else if(it.days===0)when='bugün son gün';
  else if(it.days===1)when='yarın';
  else when=`${it.days} gün kaldı`;
  const amt=it.amount!=null?` (${fmtMoney(it.amount,it.currency||'TRY')})`:'';
  return `⏰ ${it.sub}: ${it.title}${amt} — ${when}. Tamamlayınca hatırlatma durur.`;
}

async function checkReminders(){
  if(!waCfg.enabled||!waCfg.phone||!waCfg.apikey)return;
  const now=Date.now();
  const lead=waCfg.leadDays||3;
  const gapMs=(waCfg.intervalHours||5)*3600*1000;
  const items=upcomingItems().filter(i=>i.days!==null && i.days<=lead);
  const activeKeys=new Set(items.map(i=>i.key));
  let changed=false;
  // tamamlananları (artık listede olmayanları) temizle → tekrarda sıfırdan başlar
  Object.keys(remState).forEach(k=>{if(!activeKeys.has(k)){delete remState[k];changed=true}});
  for(const it of items){
    const last=remState[it.key]||0;
    if(now-last>=gapMs){
      const ok=await waSend(reminderText(it));
      if(ok){remState[it.key]=now;changed=true}
    }
  }
  if(changed)await saveRem();
}

/* ---------- Formatting helpers ---------- */
function finFmtCurrency(n, currency){
  const num = parseFloat(n) || 0;
  const cur = currency || 'TRY';
  if(cur === 'TRY') return num.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ₺';
  try {
    return new Intl.NumberFormat('tr-TR',{style:'currency',currency:cur,minimumFractionDigits:2,maximumFractionDigits:2}).format(num);
  } catch(e){
    return num.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ' + cur;
  }
}
function finFmtDate(s){
  if(!s) return '—';
  const d = new Date(s + 'T12:00:00');
  if(isNaN(d.getTime())) return s;
  return d.toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'});
}
function finTodayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* ---------- Cloud sync helpers (online-only) ---------- */
function _finCheckOnline(){
  if(!navigator.onLine || !cloudReady || !fb || !fb.db){
    toast('İşlem için internet bağlantısı gerekli.');
    return false;
  }
  return true;
}

async function finSaveRecord(uid, idbStore, fsCollection, rec){
  if(!_finCheckOnline()) throw new Error('offline');
  const now = Date.now();
  rec = {...rec, updatedAtClient: now};
  try {
    const {doc, setDoc, serverTimestamp} = fb.fs;
    const clean = {...rec, serverUpdatedAt: serverTimestamp()};
    await setDoc(doc(fb.db, FIN.userPath(uid), fsCollection, rec.id), clean);
  } catch(e){
    console.error('finSaveRecord', fsCollection, e.message);
    toast('Kayıt hatası: ' + e.message);
    throw e;
  }
  // Firestore write succeeded — update local cache
  await put(idbStore, rec);
  return rec;
}

async function _finApplyRemote(idbStore, inMemArray, remoteDoc, activeFilter){
  const local = inMemArray.find(r => r.id === remoteDoc.id);
  const localUpdated = local ? (local.updatedAtClient || 0) : 0;
  const remoteUpdated = remoteDoc.updatedAtClient || 0;
  if(!local || remoteUpdated > localUpdated){
    await put(idbStore, remoteDoc);
    const idx = inMemArray.findIndex(r => r.id === remoteDoc.id);
    if(activeFilter && !activeFilter(remoteDoc)){
      // Archived/filtered-out: remove from in-memory array
      if(idx >= 0) inMemArray.splice(idx, 1);
    } else {
      if(idx >= 0) inMemArray[idx] = remoteDoc; else inMemArray.push(remoteDoc);
    }
    return true;
  }
  return false;
}

function detachFinListeners(){
  _finListeners.forEach(u => { try{ u(); }catch(e){} });
  _finListeners = [];
}

function attachFinListeners(uid){
  if(!uid || !cloudReady || !fb || !fb.db) return;
  detachFinListeners();
  const {collection, onSnapshot} = fb.fs;
  const listen = (fsCol, idbStore, inMemArray, activeFilter) => {
    const col = collection(fb.db, FIN.userPath(uid), fsCol);
    const unsub = onSnapshot(col, snap => {
      let changed = false;
      snap.docChanges().forEach(change => {
        if(change.type === 'removed') return; // soft delete only
        const data = {id: change.doc.id, ...change.doc.data()};
        // Remove server timestamps (not serializable in IDB)
        if(data.serverUpdatedAt && typeof data.serverUpdatedAt.toDate === 'function')
          data.serverUpdatedAt = data.serverUpdatedAt.toDate().getTime();
        _finApplyRemote(idbStore, inMemArray, data, activeFilter).then(c => { if(c) changed = true; });
        // Note: async in loop is fine here — render called below
      });
      // Re-filter and re-sort after batch
      setTimeout(()=>{
        if(view.page === 'finance') render();
      }, 200);
    }, err => console.error('finListener', fsCol, err));
    _finListeners.push(unsub);
  };
  listen(FIN.COL.ACCOUNTS,     'finAccounts',     finAccounts,     a => a.status !== 'archived');
  listen(FIN.COL.TRANSACTIONS, 'finTransactions', finTransactions, t => t.status !== 'archived');
  listen(FIN.COL.CATEGORIES,   'finCategories',   finCategories,   c => c.status !== 'archived');
  listen(FIN.COL.PROJECTS,     'finProjects',     finProjects,     p => p.status !== 'archived');
}

/* ---------- Balance engine ---------- */
function finComputeBalance(accountId){
  const account = finAccounts.find(a => a.id === accountId);
  if(!account) return 0;
  let balance = parseFloat(account.openingBalance) || 0;
  const isCreditCard = account.type === 'CREDIT_CARD';
  const cutoff = account.openingBalanceDate || null;
  const txCurrency = account.currency || 'TRY';

  finTransactions.forEach(t => {
    if(cutoff && t.date && t.date < cutoff) return;
    if(isCreditCard){
      if(t.transactionType==='EXPENSE'  && t.accountId===accountId) balance += (t.amount||0);
      if(t.transactionType==='INCOME'   && t.accountId===accountId) balance -= (t.amount||0);
      if(t.transactionType==='TRANSFER' && t.destinationAccountId===accountId) balance -= (t.amount||0);
      if(t.transactionType==='TRANSFER' && t.sourceAccountId===accountId)      balance += (t.amount||0);
    } else {
      if(t.transactionType==='INCOME'   && t.accountId===accountId) balance += (t.amount||0);
      if(t.transactionType==='EXPENSE'  && t.accountId===accountId) balance -= (t.amount||0);
      if(t.transactionType==='TRANSFER' && t.destinationAccountId===accountId) balance += (t.amount||0);
      if(t.transactionType==='TRANSFER' && t.sourceAccountId===accountId)      balance -= (t.amount||0);
    }
  });
  return balance;
}

/* ---------- Cari engine ---------- */
function _finRecordCari(pairMap, debtorId, creditorId, amount, currency){
  currency = currency || 'TRY';
  if(!debtorId || !creditorId || debtorId===creditorId || (amount||0)<=0) return;
  const a = debtorId < creditorId ? debtorId : creditorId;
  const b = debtorId < creditorId ? creditorId : debtorId;
  const key = a + '__' + b + '__' + currency;
  if(!pairMap[key]) pairMap[key] = {partyA:a, partyB:b, net:0, currency};
  if(debtorId===a) pairMap[key].net += (amount||0);
  else             pairMap[key].net -= (amount||0);
}

function finComputeCari(){
  const pairMap = {};
  finTransactions.forEach(t => {
    if(t.transactionType==='EXPENSE'){
      const acct = finAccounts.find(a => a.id===t.accountId);
      if(!acct || !acct.entityId || !t.entityId || acct.entityId===t.entityId) return;
      const cur = t.currency || acct.currency || 'TRY';
      _finRecordCari(pairMap, t.entityId, acct.entityId, t.amount, cur);
    } else if(t.transactionType==='INCOME'){
      const acct = finAccounts.find(a => a.id===t.accountId);
      if(!acct || !acct.entityId || !t.entityId || acct.entityId===t.entityId) return;
      const cur = t.currency || acct.currency || 'TRY';
      _finRecordCari(pairMap, acct.entityId, t.entityId, t.amount, cur);
    } else if(t.transactionType==='TRANSFER'){
      const srcAcct = finAccounts.find(a => a.id===t.sourceAccountId);
      const dstAcct = finAccounts.find(a => a.id===t.destinationAccountId);
      if(!srcAcct || !dstAcct) return;
      const srcOwner = srcAcct.entityId, dstOwner = dstAcct.entityId;
      if(!srcOwner || !dstOwner || srcOwner===dstOwner) return;
      const purpose = t.transferPurpose;
      if(purpose!=='INTERCOMPANY' && purpose!=='SETTLEMENT') return;
      const cur = t.currency || srcAcct.currency || 'TRY';
      _finRecordCari(pairMap, dstOwner, srcOwner, t.amount, cur);
    }
  });
  return Object.values(pairMap)
    .filter(p => Math.abs(p.net) >= 0.01)
    .map(p => p.net > 0
      ? {debtorId:p.partyA, creditorId:p.partyB, balance: p.net,  currency:p.currency}
      : {debtorId:p.partyB, creditorId:p.partyA, balance:-p.net, currency:p.currency})
    .sort((a,b) => b.balance - a.balance);
}

            <div class="bname">${esc(t.merchant||t.description||t.transactionType)}</div>
            <div class="bmeta">
              <span class="bday">${finFmtDate(t.date)}</span>
              ${entity?`<span class="btag genel">${esc(entity.name)}</span>`:''}
              ${acct?`<span style="font-size:11px;color:var(--faint)">${esc(acct.name)}</span>`:''}
            </div>
          </div>
          <div style="${cls};font-weight:500">${sign}${finFmtCurrency(t.amount,t.currency||'TRY')}</div>
        </div>`;
      }).join('')}
    </div>` : `
    <div class="empty">
      <div class="ico" style="font-size:32px">💼</div>
      <div style="font-weight:500">Henüz işlem yok</div>
      <div style="font-size:13px;color:var(--muted);margin-top:4px">İşlemler sekmesinden başla</div>
    </div>`}

    <div style="margin-top:16px;text-align:center;">
      <button class="btn-prim" data-fintab="transactions" style="font-size:13px;padding:9px 20px;">+ Yeni İşlem</button>
    </div>`;
}

/* ---- Accounts ---- */
function _finAccountsHTML(){
  const grouped = {};
  finAccounts.forEach(a => {
    if(!grouped[a.entityId]) grouped[a.entityId] = [];
    grouped[a.entityId].push(a);
  });
  const entities = companies.filter(c => grouped[c.id]);

  const rows = entities.length === 0
    ? `<div class="empty"><div class="ico">🏦</div><div style="font-weight:500">Henüz hesap yok</div></div>`
    : entities.map(entity => {
        const accts = grouped[entity.id];
        return `<div class="card" style="margin-bottom:12px;">
          <div class="card-head">${esc(entity.name)}</div>
          ${accts.map(a => {
            const bal = finComputeBalance(a.id);
            const isCc = a.type==='CREDIT_CARD';
            const balCls = isCc?(bal>0?'color:#A4453B':'color:var(--good)'):(bal>=0?'color:var(--good)':'color:#A4453B');
            return `<div class="bill" style="cursor:pointer" data-finacctedit="${a.id}">
              <div class="bbody">
                <div class="bname">${esc(a.name)}</div>
                <div class="bmeta">
                  <span class="bday">${{BANK:'Banka',CASH:'Nakit',CREDIT_CARD:'Kredi Kartı',OTHER:'Diğer'}[a.type]||a.type}</span>
                  ${a.currency&&a.currency!=='TRY'?`<span class="btag genel">${esc(a.currency)}</span>`:''}
                  ${!a.openingBalanceDate?'<span class="btag" style="background:#FEF3C7;color:#92400E">Başlangıç tarihi yok</span>':''}
                </div>
              </div>
              <div style="${balCls};font-weight:600;font-size:14px;">${isCc?(bal>0?'Borç: ':'Alacak: ')+finFmtCurrency(Math.abs(bal),a.currency||'TRY'):'Bakiye: '+finFmtCurrency(bal,a.currency||'TRY')}</div>
            </div>`;
          }).join('')}
        </div>`;
      }).join('');

  return `
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
      <button class="btn-prim" id="finAddAcct" style="font-size:13px;padding:9px 18px;">+ Hesap Ekle</button>
    </div>
    ${rows}`;
}

/* ---- Transactions ---- */
function _finTransactionsHTML(){
  const rows = finTransactions.length === 0
    ? `<div class="empty"><div class="ico">📊</div><div style="font-weight:500">Henüz işlem yok</div></div>`
    : finTransactions.map(t => {
        const entity = companies.find(c => c.id===t.entityId);
        const cat = finCategories.find(c => c.id===t.categoryId);
        const sign = t.transactionType==='EXPENSE'?'−':t.transactionType==='INCOME'?'+':'';
        const cls  = t.transactionType==='EXPENSE'?'color:#A4453B':t.transactionType==='INCOME'?'color:var(--good)':'color:var(--muted)';
        const purposeLabel = t.transferPurpose ? (FIN_TRANSFER_LABELS[t.transferPurpose]||t.transferPurpose) : '';
        return `<div class="bill" style="cursor:pointer" data-fintxedit="${t.id}">
          <div class="bbody">
            <div class="bname">${esc(t.merchant||t.description||(purposeLabel||t.transactionType))}</div>
            <div class="bmeta">
              <span class="bday">${finFmtDate(t.date)}</span>
              ${entity?`<span class="btag genel">${esc(entity.name)}</span>`:''}
              ${cat?`<span style="font-size:11px;color:var(--faint)">${esc(cat.name)}</span>`:''}
              ${t.transactionType==='TRANSFER'&&purposeLabel?`<span class="btag" style="background:var(--paper-2)">${esc(purposeLabel)}</span>`:''}
            </div>
          </div>
          <div style="${cls};font-weight:500;white-space:nowrap">${sign}${finFmtCurrency(t.amount,t.currency||'TRY')}</div>
        </div>`;
      }).join('');

  return `
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
      <button class="btn-prim" id="finAddTx" style="font-size:13px;padding:9px 18px;">+ Yeni İşlem</button>
    </div>
    <div class="card">${rows}</div>`;
}

/* ---- Cari ---- */
function _finCariHTML(){
  const cariList = finComputeCari();
  const unclassified = finTransactions.filter(t => {
    if(t.transactionType!=='TRANSFER' || t.transferPurpose) return false;
    const src = finAccounts.find(a=>a.id===t.sourceAccountId);
    const dst = finAccounts.find(a=>a.id===t.destinationAccountId);
    return src && dst && src.entityId && dst.entityId && src.entityId!==dst.entityId;
  }).length;

  const rows = cariList.length === 0
    ? `<div class="empty"><div class="ico">✅</div><div style="font-weight:500">Cari borç / alacak yok</div></div>`
    : cariList.map(c => {
        const d  = companies.find(e=>e.id===c.debtorId);
        const cr = companies.find(e=>e.id===c.creditorId);
        return `<div class="bill" style="cursor:pointer" data-caridetail="${c.debtorId}|${c.creditorId}|${c.currency}">
          <div class="bbody">
            <div class="bname">${esc(d?d.name:'?')} <span style="color:var(--muted);font-weight:400">→ ${esc(cr?cr.name:'?')}'a borçlu</span></div>
            <div class="bmeta"><span class="btag genel">${esc(c.currency)}</span></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="font-weight:600;color:#A4453B">${finFmtCurrency(c.balance,c.currency)}</div>
            <span style="font-size:12px;color:var(--muted)">›</span>
          </div>
        </div>`;
      }).join('');

  return `
    ${unclassified > 0 ? `<div style="background:#FEF3C7;border:1px solid #D97706;border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:13px;color:#92400E;">
      <strong>${unclassified} sınıflandırılmamış transfer</strong> — İşlemler ekranından amaç seçin.
    </div>` : ''}
    <div class="card">${rows}</div>
    <p style="font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6;">
      Gider/Gelir'de farklı şirket sahipleri arasındaki işlemler cari oluşturur. "Şirketler Arası" veya "Cari Ödeme" transferleri de cariye dahildir. Farklı para birimleri ayrı tutulur.
    </p>`;
}

/* ---- Categories ---- */
function _finCategoriesHTML(){
  const rows = finCategories.length === 0
    ? `<div class="empty"><div class="ico">🏷</div><div style="font-weight:500">Henüz kategori yok</div></div>`
    : finCategories.map(c =>
        `<div class="bill" style="cursor:pointer" data-fincatedit="${c.id}">
          <div class="bbody"><div class="bname">${esc(c.name)}</div>
            ${c.type?`<div class="bmeta"><span class="btag genel">${c.type==='INCOME'?'Gelir':c.type==='EXPENSE'?'Gider':'Genel'}</span></div>`:''}
          </div>
        </div>`
      ).join('');
  return `
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
      <button class="btn-prim" id="finAddCat" style="font-size:13px;padding:9px 18px;">+ Kategori Ekle</button>
    </div>
    <div class="card">${rows}</div>`;
}

/* ---- Bind actions ---- */
function _finBindActions(tab){
  // Tab buttons that navigate (e.g. dashboard "Yeni İşlem" button)
  document.querySelectorAll('[data-fintab]').forEach(b =>
    b.addEventListener('click', () => { view.finTab = b.dataset.fintab; render(); }));

  // Back button
  const back = document.querySelector('[data-finback]');
  if(back) back.addEventListener('click', () => { view.page='home'; view.finTab=null; render(); });

  // Cari detail
  document.querySelectorAll('[data-caridetail]').forEach(el =>
    el.addEventListener('click', () => {
      const [debtorId, creditorId, currency] = el.dataset.caridetail.split('|');
      _finOpenCariDetail(debtorId, creditorId, currency);
    }));

  if(tab==='accounts'){
    const add = document.getElementById('finAddAcct');
    if(add) add.addEventListener('click', () => _finOpenAccountModal(null));
    document.querySelectorAll('[data-finacctedit]').forEach(el =>
      el.addEventListener('click', () => _finOpenAccountModal(el.dataset.finacctedit)));
  }
  if(tab==='transactions'){
    const add = document.getElementById('finAddTx');
    if(add) add.addEventListener('click', () => _finOpenTxModal(null));
    document.querySelectorAll('[data-fintxedit]').forEach(el =>
      el.addEventListener('click', () => _finOpenTxModal(el.dataset.fintxedit)));
  }
  if(tab==='categories'){
    const add = document.getElementById('finAddCat');
    if(add) add.addEventListener('click', () => _finOpenCategoryModal(null));
    document.querySelectorAll('[data-fincatedit]').forEach(el =>
      el.addEventListener('click', () => _finOpenCategoryModal(el.dataset.fincatedit)));
  }
  if(tab==='reconcile') _finBindReconcile();
}

/* ---- Account modal ---- */
function _finOpenAccountModal(id){
  if(!currentUser) return;
  const uid = currentUser.uid;
  const a = id ? finAccounts.find(x=>x.id===id) : null;

  const entityOpts = companies.map(c =>
    `<option value="${c.id}" ${a&&a.entityId===c.id?'selected':''}>${esc(c.name)}</option>`
  ).join('');
  const typeOpts = [['BANK','Banka Hesabı'],['CASH','Nakit / Kasa'],['CREDIT_CARD','Kredi Kartı'],['OTHER','Diğer']].map(
    ([k,v]) => `<option value="${k}" ${a&&a.type===k?'selected':k==='BANK'&&!a?'selected':''}>${v}</option>`
  ).join('');
  const curOpts = ['TRY','USD','EUR','GBP'].map(c =>
    `<option value="${c}" ${a?a.currency===c?'selected':'':c==='TRY'?'selected':''}>${c}</option>`
  ).join('');

  // Legacy link options
  const bankAcctOpts = bankAccounts.map(ba => {
    const bk = banks.find(b=>b.id===ba.bankId);
    const label = (bk?bk.name+' — ':'')+( ba.label||ba.iban||ba.id);
    return `<option value="${ba.id}" ${a&&a.linkedBankAccountId===ba.id?'selected':''}>${esc(label)}</option>`;
  });
  const cardOpts = cards.map(cd =>
    `<option value="${cd.id}" ${a&&a.linkedCardId===cd.id?'selected':''}>${esc(cd.bank+(cd.last4?' *'+cd.last4:''))}</option>`
  );

  modal.innerHTML = `
    <div class="modal-head"><div class="eyebrow">${id?'Hesabı Düzenle':'Yeni Hesap'}</div><h3>${id?'Düzenle':'Hesap Ekle'}</h3></div>
    <div class="modal-body">
      <div class="field"><label>Sahibi</label><select id="faEntity">${entityOpts}</select></div>
      <div class="field"><label>Hesap Adı</label><input type="text" id="faName" value="${esc(a?a.name:'')}" placeholder="Garanti Vadesiz"></div>
      <div class="field"><label>Tür</label><select id="faType">${typeOpts}</select></div>
      <div class="field"><label>Para Birimi</label><select id="faCur">${curOpts}</select></div>
      <div class="field"><label>Açılış Bakiyesi</label><input type="number" id="faOpening" step="0.01" value="${a?parseFloat(a.openingBalance)||0:0}"></div>
      <div class="field"><label>Açılış Tarihi (opsiyonel)</label>
        <input type="date" id="faOpeningDate" value="${esc(a?a.openingBalanceDate||'':'')}">
        <div style="font-size:11px;color:var(--muted);margin-top:3px">Bu tarihten önceki işlemler bakiyeye dahil edilmez.</div>
      </div>
      <div class="field"><label>Banka Adı (opsiyonel)</label><input type="text" id="faBankName" value="${esc(a?a.bankName||'':'')}"></div>
      ${bankAccounts.length?`<div class="field"><label>Mevcut Banka Hesabına Bağla (opsiyonel)</label>
        <select id="faLinkBank"><option value="">— bağlama —</option>${bankAcctOpts.join('')}</select></div>`:''}
      ${cards.length?`<div class="field"><label>Mevcut Karta Bağla (opsiyonel)</label>
        <select id="faLinkCard"><option value="">— bağlama —</option>${cardOpts.join('')}</select></div>`:''}
      <div class="modal-foot">
        ${id?`<button class="btn-ghost" id="faArchive" style="color:#c0392b;margin-right:auto">Pasife Al</button>`:''}
        <button class="btn-ghost" id="faCancel">İptal</button>
        <button class="btn-prim" id="faSave">Kaydet</button>
      </div>
    </div>`;
  overlay.classList.add('show');

  $('#faCancel').onclick = closeModal;
  if(id) $('#faArchive').onclick = async () => {
    if(!confirm('Bu hesabı pasife almak istiyor musunuz?')) return;
    const rec = {...(finAccounts.find(x=>x.id===id)||{}), status:'archived', updatedAtClient:Date.now()};
    try { await finSaveRecord(uid, 'finAccounts', FIN.COL.ACCOUNTS, rec); } catch(e){ return; }
    finAccounts = finAccounts.filter(x=>x.id!==id);
    closeModal(); render(); toast('Pasife alındı');
  };
  $('#faSave').onclick = async () => {
    const entityId = $('#faEntity').value;
    const name = ($('#faName').value||'').trim();
    const type = $('#faType').value;
    const currency = $('#faCur').value;
    const opening = parseFloat($('#faOpening').value)||0;
    const openingDate = $('#faOpeningDate').value || null;
    const bankName = ($('#faBankName').value||'').trim() || null;
    const linkBank = document.getElementById('faLinkBank')?$('#faLinkBank').value||null:null;
    const linkCard = document.getElementById('faLinkCard')?$('#faLinkCard').value||null:null;
    if(!name){ toast('Hesap adı gerekli'); return; }
    if(!entityId){ toast('Hesap sahibi gerekli'); return; }

    // Auto-fill name/bankName from linked record if empty
    let finalName = name;
    let finalBankName = bankName;
    if(linkBank && !name){
      const ba = bankAccounts.find(x=>x.id===linkBank);
      const bk = ba ? banks.find(b=>b.id===ba.bankId) : null;
      finalName = ba ? (ba.label || ba.iban || 'Banka Hesabı') : finalName;
      finalBankName = bk ? bk.name : finalBankName;
    }
    if(linkCard && !name){
      const cd = cards.find(x=>x.id===linkCard);
      finalName = cd ? (cd.bank+(cd.last4?' *'+cd.last4:'')) : finalName;
    }

    const rec = {
      id: a ? a.id : generateId(),
      entityId, name:finalName||name, type, currency,
      openingBalance:opening, openingBalanceDate:openingDate,
      bankName:finalBankName,
      linkedBankAccountId: linkBank || (a?a.linkedBankAccountId:null),
      linkedCardId: linkCard || (a?a.linkedCardId:null),
      status:'active',
      createdAt: a ? a.createdAt : Date.now(),
      updatedAtClient: Date.now(),
    };
    let saved;
    try { saved = await finSaveRecord(uid, 'finAccounts', FIN.COL.ACCOUNTS, rec); } catch(e){ return; }
    if(!finAccounts.find(x=>x.id===saved.id)) finAccounts.push(saved);
    else { const i=finAccounts.findIndex(x=>x.id===saved.id); finAccounts[i]=saved; }
    closeModal(); render(); toast(id?'Güncellendi':'Hesap eklendi');
  };
}

/* ---- Transaction modal ---- */
function _finOpenTxModal(id){
  if(!currentUser) return;
  const uid = currentUser.uid;
  const t = id ? finTransactions.find(x=>x.id===id) : null;
  let txType = t ? t.transactionType : 'EXPENSE';

  function _buildTxForm(){
    const acctOpts = finAccounts.map(a => {
      const c = companies.find(x=>x.id===a.entityId);
      return `<option value="${a.id}" ${t&&(t.accountId===a.id||t.sourceAccountId===a.id)?'selected':''}>${esc((c?c.name+' / ':'')+a.name)}</option>`;
    }).join('');
    const dstOpts = finAccounts.map(a => {
      const c = companies.find(x=>x.id===a.entityId);
      return `<option value="${a.id}" ${t&&t.destinationAccountId===a.id?'selected':''}>${esc((c?c.name+' / ':'')+a.name)}</option>`;
    }).join('');
    const entityOpts = companies.map(c =>
      `<option value="${c.id}" ${t&&t.entityId===c.id?'selected':''}>${esc(c.name)}</option>`
    ).join('');
    const catOpts = finCategories.filter(c => !c.type || c.type===txType || c.type==='GENERAL')
      .map(c => `<option value="${c.id}" ${t&&t.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
    const purposeOpts = Object.entries(FIN_TRANSFER_LABELS).filter(([k])=>k!=='UNCLASSIFIED').map(([k,v]) =>
      `<option value="${k}" ${t&&t.transferPurpose===k?'selected':k==='INTERNAL'&&!t?'selected':''}>${v}</option>`
    ).join('');
    const today = finTodayStr();
    const isTransfer = txType==='TRANSFER';
    const isExpense = txType==='EXPENSE';
    const typeRow = ['INCOME','EXPENSE','TRANSFER'].map(tp =>
      `<button type="button" class="${tp===txType?'on':''}" data-txtype="${tp}">${tp==='INCOME'?'Gelir':tp==='EXPENSE'?'Gider':'Transfer'}</button>`
    ).join('');
    return `
      <div class="seg" id="txTypeSeg" style="margin-bottom:14px">${typeRow}</div>
      <div class="field"><label>Tarih</label><input type="date" id="faTxDate" value="${t?t.date:today}"></div>
      <div class="field"><label>Tutar</label><input type="number" id="faTxAmount" step="0.01" min="0" placeholder="0,00" value="${t?t.amount:''}"></div>
      ${isTransfer ? `
        <div class="field"><label>Kaynak Hesap</label><select id="faTxSrc">${acctOpts}</select></div>
        <div class="field"><label>Hedef Hesap</label><select id="faTxDst">${dstOpts}</select></div>
        <div id="finCrossCurrWarn" style="display:none;background:#FEF3C7;border-radius:8px;padding:8px 12px;font-size:12px;color:#92400E;margin-bottom:8px">Farklı para birimleri — cross-currency transfer engellendi.</div>
        <div class="field"><label>Transfer Amacı</label><select id="faTxPurpose">${purposeOpts}</select></div>
        <div id="finSettlePrev" style="font-size:12px;color:var(--muted);padding:6px 0;display:none"></div>
      ` : `
        <div class="field"><label>Hesap</label><select id="faTxAcct">${acctOpts}</select></div>
        <div id="faTxCurInfo" style="font-size:11px;color:var(--muted);margin-top:-6px;margin-bottom:6px;"></div>
        <div class="field"><label>Taraf (${isExpense?'Gider yapan':'Gelir gelen'})</label><select id="faTxEntity"><option value="">— seç —</option>${entityOpts}</select></div>
        <div class="field"><label>Kategori</label><select id="faTxCat"><option value="">— seç —</option>${catOpts}</select></div>
      `}
      <div class="field"><label>${isTransfer?'Açıklama':'İşyeri / Açıklama'}</label>
        <input type="text" id="faTxDesc" placeholder="${isTransfer?'Opsiyonel':'Örn. Migros'}" value="${esc(t?t.merchant||t.description||'':'')}">
      </div>`;
  }

  modal.innerHTML = `
    <div class="modal-head"><div class="eyebrow">${id?'İşlemi Düzenle':'Yeni İşlem'}</div><h3>${id?'Düzenle':'İşlem Ekle'}</h3></div>
    <div class="modal-body">
      <div id="faTxFormWrap">${_buildTxForm()}</div>
      <div class="modal-foot">
        ${id?`<button class="btn-ghost" id="faTxDelete" style="color:#c0392b;margin-right:auto">Sil</button>`:''}
        <button class="btn-ghost" id="faTxCancel">İptal</button>
        <button class="btn-prim" id="faTxSave">Kaydet</button>
      </div>
    </div>`;
  overlay.classList.add('show');

  function _rebind(){
    document.querySelectorAll('#txTypeSeg [data-txtype]').forEach(b =>
      b.addEventListener('click',()=>{
        txType=b.dataset.txtype;
        document.getElementById('faTxFormWrap').innerHTML=_buildTxForm();
        _rebind();
      }));
    // Currency info for expense/income
    const acctEl=document.getElementById('faTxAcct');
    if(acctEl) acctEl.addEventListener('change',()=>{
      const a=finAccounts.find(x=>x.id===acctEl.value);
      const el=document.getElementById('faTxCurInfo');
      if(el) el.textContent=a&&a.currency&&a.currency!=='TRY'?'Para birimi: '+a.currency:'';
    });
    // Cross-currency check for transfer
    const checkCross=()=>{
      const src=document.getElementById('faTxSrc');const dst=document.getElementById('faTxDst');
      const warn=document.getElementById('finCrossCurrWarn');
      if(!src||!dst||!warn) return;
      const sA=finAccounts.find(a=>a.id===src.value);
      const dA=finAccounts.find(a=>a.id===dst.value);
      const cross=sA&&dA&&(sA.currency||'TRY')!==(dA.currency||'TRY');
      warn.style.display=cross?'block':'none';
    };
    const srcEl=document.getElementById('faTxSrc');
    const dstEl=document.getElementById('faTxDst');
    if(srcEl) srcEl.addEventListener('change',checkCross);
    if(dstEl) dstEl.addEventListener('change',checkCross);
  }
  _rebind();

  $('#faTxCancel').onclick=closeModal;
  if(id) $('#faTxDelete').onclick=async()=>{
    if(!confirm('Bu işlemi silmek istiyor musunuz?')) return;
    const rec={...(finTransactions.find(x=>x.id===id)||{}),status:'archived',updatedAtClient:Date.now()};
    try { await finSaveRecord(uid,'finTransactions',FIN.COL.TRANSACTIONS,rec); } catch(e){ return; }
    finTransactions=finTransactions.filter(x=>x.id!==id);
    closeModal(); render(); toast('Silindi');
  };
  $('#faTxSave').onclick=async()=>{
    const dateVal=($('#faTxDate')||{}).value;
    const amountVal=parseFloat(($('#faTxAmount')||{}).value)||0;
    if(!dateVal){ toast('Tarih gerekli'); return; }
    if(amountVal<=0){ toast('Tutar 0\'dan büyük olmalı'); return; }

    let rec;
    if(txType==='TRANSFER'){
      const srcId=($('#faTxSrc')||{}).value;
      const dstId=($('#faTxDst')||{}).value;
      if(!srcId||!dstId){ toast('Kaynak ve hedef hesap gerekli'); return; }
      const srcAcct=finAccounts.find(a=>a.id===srcId);
      const dstAcct=finAccounts.find(a=>a.id===dstId);
      const srcCur=(srcAcct?srcAcct.currency:null)||'TRY';
      const dstCur=(dstAcct?dstAcct.currency:null)||'TRY';
      if(srcCur!==dstCur){ toast('Farklı para birimi — cross-currency transfer engellendi'); return; }
      const purpose=($('#faTxPurpose')||{}).value||'INTERNAL';
      // SETTLEMENT validation
      if(purpose==='SETTLEMENT'){
        const srcOwner=srcAcct?srcAcct.entityId:null;
        const dstOwner=dstAcct?dstAcct.entityId:null;
        const cariList=finComputeCari();
        const correctCari=cariList.find(c=>c.debtorId===srcOwner&&c.creditorId===dstOwner&&c.currency===srcCur);
        const reverseCari=cariList.find(c=>c.debtorId===dstOwner&&c.creditorId===srcOwner&&c.currency===srcCur);
        if(reverseCari&&!correctCari){
          if(!confirm('Uyarı: Bu ödeme carinin ters yönündedir ve mevcut cariyi artıracaktır. Devam?')) return;
        } else if(correctCari&&amountVal>correctCari.balance+0.01){
          toast('Ödeme tutarı mevcut cari bakiyeden ('+finFmtCurrency(correctCari.balance,srcCur)+') yüksek'); return;
        }
      }
      rec={
        id: t?t.id:(Date.now().toString(36)+Math.random().toString(36).slice(2,7)),
        transactionType:'TRANSFER', date:dateVal, amount:amountVal, currency:srcCur,
        sourceAccountId:srcId, destinationAccountId:dstId, transferPurpose:purpose,
        description:(($('#faTxDesc')||{}).value||'').trim()||null,
        status:'active', createdAt:t?t.createdAt:Date.now(), updatedAtClient:Date.now(),
      };
    } else {
      const acctId=($('#faTxAcct')||{}).value;
      if(!acctId){ toast('Hesap gerekli'); return; }
      const acct=finAccounts.find(a=>a.id===acctId);
      const txCur=(acct?acct.currency:null)||'TRY';
      const entityId=($('#faTxEntity')||{}).value||null;
      const catId=($('#faTxCat')||{}).value||null;
      rec={
        id: t?t.id:(Date.now().toString(36)+Math.random().toString(36).slice(2,7)),
        transactionType:txType, date:dateVal, amount:amountVal, currency:txCur,
        accountId:acctId, entityId, categoryId:catId,
        merchant:(($('#faTxDesc')||{}).value||'').trim()||null,
        status:'active', createdAt:t?t.createdAt:Date.now(), updatedAtClient:Date.now(),
      };
    }
    let saved;
    try { saved=await finSaveRecord(uid,'finTransactions',FIN.COL.TRANSACTIONS,rec); } catch(e){ return; }
    if(!finTransactions.find(x=>x.id===saved.id)) finTransactions.push(saved);
    else { const i=finTransactions.findIndex(x=>x.id===saved.id); finTransactions[i]=saved; }
    finTransactions.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    closeModal(); render(); toast(id?'Güncellendi':'İşlem eklendi');
  };
}

/* ---- Cari detail modal ---- */
function _finOpenCariDetail(debtorId, creditorId, currency){
  const d  = companies.find(c=>c.id===debtorId);
  const cr = companies.find(c=>c.id===creditorId);
  const title = `${d?d.name:'?'} → ${cr?cr.name:'?'}`;

  const items = [];
  finTransactions.forEach(t => {
    let impact=0, label='';
    if(t.transactionType==='EXPENSE'){
      const acct=finAccounts.find(a=>a.id===t.accountId);
      if(!acct||!acct.entityId||!t.entityId||acct.entityId===t.entityId) return;
      const cur=t.currency||acct.currency||'TRY';
      if(cur!==currency) return;
      if(t.entityId===debtorId&&acct.entityId===creditorId){ impact=(t.amount||0); label='Gider'; }
      else if(t.entityId===creditorId&&acct.entityId===debtorId){ impact=-(t.amount||0); label='Gider (ters)'; }
      else return;
    } else if(t.transactionType==='INCOME'){
      const acct=finAccounts.find(a=>a.id===t.accountId);
      if(!acct||!acct.entityId||!t.entityId||acct.entityId===t.entityId) return;
      const cur=t.currency||acct.currency||'TRY';
      if(cur!==currency) return;
      if(acct.entityId===debtorId&&t.entityId===creditorId){ impact=(t.amount||0); label='Gelir'; }
      else if(acct.entityId===creditorId&&t.entityId===debtorId){ impact=-(t.amount||0); label='Gelir (ters)'; }
      else return;
    } else if(t.transactionType==='TRANSFER'){
      const srcAcct=finAccounts.find(a=>a.id===t.sourceAccountId);
      const dstAcct=finAccounts.find(a=>a.id===t.destinationAccountId);
      if(!srcAcct||!dstAcct) return;
      const srcOwner=srcAcct.entityId,dstOwner=dstAcct.entityId;
      if(!srcOwner||!dstOwner||srcOwner===dstOwner) return;
      const purpose=t.transferPurpose;
      if(purpose!=='INTERCOMPANY'&&purpose!=='SETTLEMENT') return;
      const cur=t.currency||srcAcct.currency||'TRY';
      if(cur!==currency) return;
      const pl=FIN_TRANSFER_LABELS[purpose]||purpose;
      if(dstOwner===debtorId&&srcOwner===creditorId){ impact=(t.amount||0); label=pl; }
      else if(dstOwner===creditorId&&srcOwner===debtorId){ impact=-(t.amount||0); label=pl; }
      else return;
    } else return;
    if(impact!==0) items.push({t,impact,label});
  });
  items.sort((a,b)=>(a.t.date||'').localeCompare(b.t.date||''));

  const bodyHTML = items.length===0
    ? `<p style="color:var(--muted);text-align:center;padding:20px 0">Bu cariye katkıda bulunan işlem bulunamadı.</p>`
    : `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="border-bottom:1px solid var(--line)">
          <th style="text-align:left;padding:6px 8px;font-weight:500">Tarih</th>
          <th style="text-align:left;padding:6px 8px;font-weight:500">Tip</th>
          <th style="text-align:left;padding:6px 8px;font-weight:500">Açıklama</th>
          <th style="text-align:right;padding:6px 8px;font-weight:500">Etki (${esc(currency)})</th>
        </tr></thead>
        <tbody>${items.map(item => {
          const sign=item.impact>0?'+':'−';
          const cls=item.impact>0?'color:#A4453B':'color:var(--good)';
          return `<tr style="border-bottom:1px solid var(--line)">
            <td style="padding:6px 8px;white-space:nowrap">${finFmtDate(item.t.date)}</td>
            <td style="padding:6px 8px"><span class="btag genel">${esc(item.label)}</span></td>
            <td style="padding:6px 8px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(item.t.merchant||item.t.description||'—')}</td>
            <td style="padding:6px 8px;text-align:right;${cls};font-weight:600">${sign}${finFmtCurrency(Math.abs(item.impact),currency)}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
      <p style="font-size:11px;color:var(--muted);margin-top:10px">+ = ${esc(d?d.name:'?')}'nın borcu artar · − = borcu azalır</p>`;

  modal.innerHTML=`
    <div class="modal-head"><div class="eyebrow">Cari Detay · ${esc(currency)}</div><h3>${title}</h3></div>
    <div class="modal-body">${bodyHTML}
      <div class="modal-foot"><button class="btn-ghost" id="fcariClose">Kapat</button></div>
    </div>`;
  overlay.classList.add('show');
  $('#fcariClose').onclick=closeModal;
}

/* ---------- State ---------- */
let finStmtImports = [], finStmtItems = [];

/* ---------- PDF.js demand loader ---------- */
async function _loadPdfJs(){
  if(window.pdfjsLib) return window.pdfjsLib;
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return window.pdfjsLib;
}

/* ---------- PDF metin çıkarma — koordinat tabanlı satır gruplama ---------- */
async function _parsePDF(file){
  const lib = await _loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({data: buf}).promise;
  const numPages = pdf.numPages;
  let totalItems = 0;
  const allRows = []; // logical rows across all pages

  for(let p = 1; p <= numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const items = content.items.filter(it => it.str && it.str.trim());
    totalItems += items.length;
    console.log(`PDF page ${p}/${numPages}: ${items.length} text items`);

    // Group text items by Y coordinate (transform[5]), tolerance 4px
    const Y_TOL = 4;
    const groups = []; // {y, items:[{x,str}]}
    for(const it of items){
      const x = it.transform[4];
      const y = it.transform[5];
      let grp = groups.find(g => Math.abs(g.y - y) <= Y_TOL);
      if(!grp){ grp = {y, items:[]}; groups.push(grp); }
      grp.items.push({x, str: it.str});
    }

    // Sort groups top-to-bottom (PDF Y=0 is bottom → descending Y = top-first)
    groups.sort((a, b) => b.y - a.y);

    for(const grp of groups){
      grp.items.sort((a, b) => a.x - b.x); // left to right
      const rowText = grp.items.map(it => it.str).join(' ').trim();
      if(rowText) allRows.push(rowText);
    }
  }

  console.log(`PDF parse complete: ${numPages} pages, ${totalItems} items, ${allRows.length} logical rows`);
  return { numPages, totalItems, rows: allRows };
}

/* ---------- Banka hareketi parser — satır dizisi alır ---------- */
// rows: string[] — each entry is one logical PDF row (Y-grouped, X-sorted)
// Returns { items, candidateCount, fmt }
// NO minimum amount filter here — filtering is UI-only
function _parseBankLines(rows){
  const items = [];
  let candidateCount = 0;
  const dateRe = /\b(\d{2})[.\/-](\d{2})[.\/-](20\d{2})\b/;

  // Auto-detect amount format per PDF
  // Turkish: 1.234,56   English: 1,234.56
  let engCount = 0, turCount = 0;
  for(const row of rows){
    engCount += (row.match(/\d{1,3}(?:,\d{3})+\.\d{2}/g)||[]).length;
    turCount += (row.match(/\d{1,3}(?:\.\d{3})+,\d{2}/g)||[]).length;
  }
  const fmt = engCount >= turCount ? 'EN' : 'TR';
  console.log(`Amount format detected: ${fmt} (EN=${engCount} TR=${turCount})`);

  // EN: requires .XX decimal → avoids matching bare integers / years
  // TR: requires ,XX decimal
  const amtRe = fmt === 'EN'
    ? /[+-]?\d{1,3}(?:,\d{3})*\.\d{2}/g
    : /[+-]?\d{1,3}(?:\.\d{3})*,\d{2}/g;

  const parseAmt = (s) => fmt === 'EN'
    ? parseFloat(s.replace(/,/g,''))
    : parseFloat(s.replace(/\./g,'').replace(',','.'));

  for(const line of rows){
    if(!line || line.length <= 2) continue;
    const dm = line.match(dateRe);
    if(!dm) continue;
    candidateCount++;

    const amts = [...line.matchAll(amtRe)].map(m => parseAmt(m[0])).filter(n => !isNaN(n));
    if(amts.length === 0) continue;

    const txAmt  = amts.length >= 2 ? amts[amts.length - 2] : amts[0];
    const absAmt = Math.abs(txAmt);
    if(absAmt < 0.01) continue;

    const lu = line.toUpperCase();
    let dir;
    if(txAmt < 0 || lu.includes('BORÇ') || lu.includes('DEBIT') || lu.includes('ÇIKIŞ')) dir = 'OUT';
    else if(txAmt > 0 || lu.includes('ALACAK') || lu.includes('CREDIT') || lu.includes('GİRİŞ')) dir = 'IN';
    else dir = 'OUT';

    const dateStr = `${dm[3]}-${dm[2]}-${dm[1]}`;
    const balanceAfter = amts.length >= 2 ? Math.abs(amts[amts.length - 1]) : null;

    // Strip dates and amounts from description (same amtRe so no leftover number fragments)
    let desc = line
      .replace(new RegExp(dateRe.source,'g'),'')
      .replace(amtRe,'')
      .replace(/\s{2,}/g,' ').trim();
    if(!desc) desc = '—';

    items.push({
      date: dateStr,
      description: desc.substring(0,200),
      amount: absAmt,
      direction: dir,
      balanceAfter,
      rawText: line.substring(0,300),
    });
  }
  return { items, candidateCount, fmt };
}

/* ---------- Duplicate matcher ---------- */
function _finFindMatch(item){
  const dirType = item.direction === 'OUT' ? 'EXPENSE' : 'INCOME';
  for(const t of finTransactions){
    if(Math.abs((t.amount||0) - item.amount) > 0.01) continue;
    const acctMatch =
      (t.transactionType === dirType  && t.accountId === item.accountId) ||
      (t.transactionType === 'TRANSFER' && item.direction === 'OUT' && t.sourceAccountId === item.accountId) ||
      (t.transactionType === 'TRANSFER' && item.direction === 'IN'  && t.destinationAccountId === item.accountId);
    if(!acctMatch) continue;
    const d1 = new Date((t.date||'')+'T12:00:00');
    const d2 = new Date((item.date||'')+'T12:00:00');
    if(isNaN(d1)||isNaN(d2)) continue;
    if(Math.abs(d1-d2) <= 86400000) return t;
  }
  return null;
}

/* ---------- Import oluştur ---------- */
async function _finCreateStmtImport(uid, accountId, fileName, rawItems){
  const importId = generateId();
  const now = Date.now();
  const stmtItems = rawItems.map(ri => {
    const match = _finFindMatch({...ri, accountId});
    return {
      id: generateId(),
      importId,
      accountId,
      date: ri.date,
      description: ri.description,
      amount: ri.amount,
      direction: ri.direction,
      balanceAfter: ri.balanceAfter||null,
      rawText: ri.rawText||'',
      status: match ? 'MATCHED' : 'REVIEW',
      matchedTransactionId: match ? match.id : null,
      proposedType: null, entityId: null, categoryId: null, projectId: null,
      notes: null, createdTransactionId: null,
    };
  });

  const dates = rawItems.map(r=>r.date).filter(Boolean).sort();
  const importRec = {
    id: importId, accountId, fileName,
    statementStartDate: dates[0]||null,
    statementEndDate: dates[dates.length-1]||null,
    importedAt: now, status:'ACTIVE',
    itemCount: stmtItems.length, reviewedCount: 0,
    updatedAtClient: now, createdAt: now,
  };

  await finSaveRecord(uid, 'finStmtImports', FIN.COL.STMT_IMPORTS, importRec);
  finStmtImports.unshift(importRec);

  for(const item of stmtItems) await put('finStmtItems', item);
  finStmtItems = stmtItems;
  view.stmtImportId = importId;
}

/* ---------- Stmt items IDB'den yükle ---------- */
async function _loadStmtItemsForView(){
  if(!view.stmtImportId) return;
  const all = await getAll('finStmtItems');
  finStmtItems = all.filter(i => i.importId === view.stmtImportId);
  if(view.page === 'finance' && view.finTab === 'reconcile') render();
}

/* ---------- Item IDB güncelle (in-memory + IDB) ---------- */
async function _saveStmtItem(item){
  await put('finStmtItems', item);
  const idx = finStmtItems.findIndex(x=>x.id===item.id);
  if(idx>=0) finStmtItems[idx]=item; else finStmtItems.push(item);
}

/* ---------- Import reviewedCount güncelle ---------- */
async function _updateImportProgress(uid, importId){
  const imp = finStmtImports.find(x=>x.id===importId);
  if(!imp) return;
  const all = await getAll('finStmtItems');
  const reviewed = all.filter(i=>i.importId===importId&&(i.status==='APPROVED'||i.status==='IGNORED'||i.status==='MATCHED')).length;
  const updated = {...imp, reviewedCount: reviewed, updatedAtClient: Date.now()};
  try { await finSaveRecord(uid, 'finStmtImports', FIN.COL.STMT_IMPORTS, updated); } catch(e){}
  const idx = finStmtImports.findIndex(x=>x.id===importId);
  if(idx>=0) finStmtImports[idx]=updated;
}

/* ---------- Onay: staging → gerçek transaction ---------- */
async function _finApproveStmtItem(uid, itemId, txData){
  const item = finStmtItems.find(x=>x.id===itemId);
  if(!item) return;
  const rec = {...txData, source:'BANK_STATEMENT', statementImportId:item.importId, statementItemId:item.id};
  let saved;
  try { saved = await finSaveRecord(uid, 'finTransactions', FIN.COL.TRANSACTIONS, rec); } catch(e){ return; }
  finTransactions.push(saved);
  finTransactions.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  await _saveStmtItem({...item, status:'APPROVED', createdTransactionId: saved.id});
  await _updateImportProgress(uid, item.importId);
}

/* ---------- Yok say / toplu yok say / geri al ---------- */
async function _finIgnoreStmtItem(itemId){
  const item = finStmtItems.find(x=>x.id===itemId);
  if(item) await _saveStmtItem({...item, status:'IGNORED'});
}
/* ---------- Import sil ---------- */
async function _finDeleteStmtImport(uid, importId){
  const imp = finStmtImports.find(x=>x.id===importId);
  if(!imp) return;
  try {
    await finSaveRecord(uid, 'finStmtImports', FIN.COL.STMT_IMPORTS,
      {...imp, status:'deleted', updatedAtClient:Date.now()});
  } catch(e){ return; }
  const allItems = await getAll('finStmtItems');
  for(const item of allItems.filter(i=>i.importId===importId))
    await del('finStmtItems', item.id);
  finStmtImports = finStmtImports.filter(x=>x.id!==importId);
  if(view.stmtImportId === importId){ view.stmtImportId = null; finStmtItems = []; }
}

async function _finBulkIgnoreItems(itemIds){
  for(const id of itemIds) await _finIgnoreStmtItem(id);
}
async function _finUnmatchStmtItem(itemId){
  const item = finStmtItems.find(x=>x.id===itemId);
  if(item) await _saveStmtItem({...item, status:'REVIEW', matchedTransactionId:null});
}
async function _finReopenStmtItem(itemId){
  const item = finStmtItems.find(x=>x.id===itemId);
  if(!item) return;
  if(item.status==='APPROVED' && item.createdTransactionId && currentUser){
    const tx = finTransactions.find(t=>t.id===item.createdTransactionId);
    if(tx){
      try {
        await finSaveRecord(currentUser.uid,'finTransactions',FIN.COL.TRANSACTIONS,
          {...tx, status:'archived', updatedAtClient:Date.now()});
        finTransactions = finTransactions.filter(t=>t.id!==item.createdTransactionId);
      } catch(e){ toast('Transaction arşivlenemedi'); return; }
    }
  }
  await _saveStmtItem({...item, status:'REVIEW', matchedTransactionId:null, createdTransactionId:null});
}
